<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Your Space | Aura</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
    <style>
        :root { --lavender-deep: #6750A4; --lavender-soft: #F3E5F5; }
        body { font-family: 'Inter', sans-serif; background: #FDFCFD; margin: 0; padding-top: 100px; }
        nav { position: fixed; top: 0; width: 100%; height: 80px; display: flex; align-items: center; padding: 0 5%; background: white; z-index: 100; border-bottom: 1px solid #eee; }
        
        .studio-map { max-width: 900px; margin: 0 auto; padding: 40px; text-align: center; }
        .instructor-stage { 
            width: 150px; height: 8px; background: var(--lavender-deep); 
            margin: 0 auto 60px; border-radius: 20px; position: relative;
        }
        .instructor-stage::after { content: 'INSTRUCTOR'; position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: 3px; color: var(--lavender-deep); font-weight: bold; }

        .mats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; max-width: 600px; margin: 0 auto; }
        .mat { 
            aspect-ratio: 1/1.8; border: 1px solid var(--lavender-soft); border-radius: 12px; 
            cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: white;
        }
        .mat span { font-size: 20px; color: var(--lavender-deep); opacity: 0.3; }
        .mat.occupied { background: #f9f9f9; border: none; cursor: not-allowed; opacity: 0.4; }
        .mat.selected { background: var(--lavender-deep); transform: scale(1.1); box-shadow: 0 10px 20px rgba(103, 80, 164, 0.2); }
        .mat.selected span { color: white; opacity: 1; }

        .btn-book { margin-top: 50px; background: var(--lavender-deep); color: white; border: none; padding: 16px 50px; border-radius: 40px; font-family: 'Playfair Display'; font-size: 18px; cursor: pointer; display: none; }
    </style>
</head>
<body>
    <nav>
        <div style="flex-grow:1; font-family:'Playfair Display'; font-size:24px; color:var(--lavender-deep)">Aura Booking</div>
        <div style="font-size:12px; letter-spacing:1px;"><a href="index.html" style="text-decoration:none; color:black;">BACK TO HOME</a></div>
    </nav>

    <div class="studio-map">
        <h2 style="font-family:'Playfair Display'; font-size: 36px; margin-bottom: 10px;">The Floor Plan</h2>
        <p style="color: #888; margin-bottom: 60px;">Select your preferred mat for the 6:00 PM Flow.</p>

        <div class="instructor-stage"></div>
        <div class="mats-grid" id="mats"></div>

        <button id="bookBtn" class="btn-book" onclick="alert('Spot Reserved!')">Reserve My Mat</button>
    </div>

    <script>
        const grid = document.getElementById('mats');
        for (let i = 1; i <= 15; i++) {
            const isTaken = Math.random() < 0.4;
            const mat = document.createElement('div');
            mat.className = `mat ${isTaken ? 'occupied' : ''}`;
            mat.innerHTML = `<span class="material-symbols-outlined">${isTaken ? 'person' : 'spa'}</span><small style="font-size:8px; margin-top:5px">${i}</small>`;
            if (!isTaken) {
                mat.onclick = () => {
                    document.querySelectorAll('.mat').forEach(m => m.classList.remove('selected'));
                    mat.classList.add('selected');
                    document.getElementById('bookBtn').style.display = 'inline-block';
                };
            }
            grid.appendChild(mat);
        }
    </script>
</body>
</html>
