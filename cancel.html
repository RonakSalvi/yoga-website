<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Your Yog Shala Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #967BB6; 
            --primary-dark: #6D598A; 
            --secondary: #F3E5F5; 
            --bg-light: #FBF9FF; 
            --dark: #2D2438; 
            --white: #ffffff;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(150, 123, 182, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-dark);
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        p {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .message {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .home-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background-color: var(--primary);
            color: var(--white);
            text-decoration: none;
            border-radius: 50px;
            transition: background-color 0.3s;
        }
        .home-link:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cancellation Request</h1>
        <div id="statusMessage" class="message info">
            <i class="fa-solid fa-spinner fa-spin"></i> Processing your request...
        </div>
        <a href="index.html" class="home-link">Return to Yog Shala</a>
    </div>

    <script>
        // IMPORTANT: Replace this with your actual SheetDB API URL for bookings
        const BOOKING_API_URL = "https://sheetdb.io/api/v1/jigyhyj6enowg"; 

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const statusMessage = document.getElementById('statusMessage');

            if (!token) {
                statusMessage.className = 'message error';
                statusMessage.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> No cancellation token provided. Please ensure you use the full link.';
                return;
            }

            statusMessage.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Attempting to cancel booking with token: ${token}`;

            try {
                // SheetDB uses DELETE with a query parameter to delete rows
                const response = await fetch(`${BOOKING_API_URL}/token/${token}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.deletedCount && result.deletedCount > 0) {
                        statusMessage.className = 'message success';
                        statusMessage.innerHTML = '<i class="fa-solid fa-circle-check"></i> Your booking has been successfully cancelled. We hope to see you again soon!';
                    } else {
                        statusMessage.className = 'message error';
                        statusMessage.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Booking not found or already cancelled. Please check your token or contact the studio.';
                    }
                } else {
                    const errorText = await response.text();
                    statusMessage.className = 'message error';
                    statusMessage.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Failed to cancel booking. Server error: ${response.status} - ${errorText}`;
                    console.error("Cancellation failed:", response.status, errorText);
                }
            } catch (error) {
                statusMessage.className = 'message error';
                statusMessage.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> A network error occurred. Please try again or contact the studio directly.`;
                console.error("Network error during cancellation:", error);
            }
        });
    </script>
</body>
</html>
