<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Yog Shala Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #967BB6; 
            --primary-dark: #6D598A; 
            --secondary: #F3E5F5; 
            --bg-light: #FBF9FF; 
            --dark: #2D2438; 
            --white: #ffffff;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: var(--white);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(150, 123, 182, 0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn:hover {
            background: var(--primary-dark);
        }
        .icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .success-icon { color: #28a745; } /* Green for success */
        .error-icon { color: #dc3545; }   /* Red for error */
        .info-icon { color: #ffc107; }    /* Yellow for info */
    </style>
</head>
<body>
    <div class="container">
        <div id="status-icon" class="icon"><i class="fa-solid fa-spinner loading-spinner"></i></div>
        <h1 id="status-heading">Processing Cancellation...</h1>
        <p id="status-message">Please wait while we cancel your booking.</p>
        <a href="index.html" class="btn" id="home-btn" style="display:none;">Go to Home</a>
    </div>

    <script>
        // IMPORTANT: Replace this with your actual SheetDB API URL
        const API_URL = "https://sheetdb.io/api/v1/jigyhyj6enowg"; 

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const statusIcon = document.getElementById('status-icon');
            const statusHeading = document.getElementById('status-heading');
            const statusMessage = document.getElementById('status-message');
            const homeBtn = document.getElementById('home-btn');

            if (!token) {
                statusIcon.innerHTML = '<i class="fa-solid fa-circle-exclamation error-icon"></i>';
                statusHeading.innerText = 'Invalid Link';
                statusMessage.innerText = 'The cancellation link is missing a valid token. Please check your email or contact support.';
                homeBtn.style.display = 'inline-block';
                return;
            }

            try {
                // SheetDB.io DELETE request to remove the row with the matching token
                const response = await fetch(`${API_URL}/token/${token}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.deletedCount && result.deletedCount > 0) {
                        statusIcon.innerHTML = '<i class="fa-solid fa-circle-check success-icon"></i>';
                        statusHeading.innerText = 'Booking Cancelled!';
                        statusMessage.innerText = 'Your booking has been successfully cancelled. We hope to see you again soon!';
                    } else {
                        // Token found in URL but no matching record deleted (e.g., already cancelled or token incorrect)
                        statusIcon.innerHTML = '<i class="fa-solid fa-circle-info info-icon"></i>';
                        statusHeading.innerText = 'Cancellation Status';
                        statusMessage.innerText = 'No active booking found for this cancellation link. It might have already been cancelled or is invalid.';
                    }
                } else {
                    const errorText = await response.text();
                    console.error("SheetDB DELETE failed:", response.status, response.statusText, errorText);
                    statusIcon.innerHTML = '<i class="fa-solid fa-circle-xmark error-icon"></i>';
                    statusHeading.innerText = 'Cancellation Failed';
                    statusMessage.innerText = `There was an error processing your cancellation. Please try again or contact support. (Error: ${response.status})`;
                }
            } catch (error) {
                console.error("Error during cancellation fetch:", error);
                statusIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation error-icon"></i>';
                statusHeading.innerText = 'Network Error';
                statusMessage.innerText = 'Could not connect to the cancellation service. Please check your internet connection and try again.';
            } finally {
                homeBtn.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
