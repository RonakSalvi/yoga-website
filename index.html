<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Yoga | Stuttgart Sanctuary</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #967BB6; 
            --primary-dark: #6D598A; 
            --secondary: #F3E5F5; 
            --bg-light: #FBF9FF; 
            --dark: #2D2438; 
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-light); color: var(--dark); overflow-x: hidden; scroll-behavior: smooth; }

        /* --- Navigation --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 10%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--secondary);
        }
        .logo { font-size: 1.6rem; font-weight: 700; color: var(--primary); text-decoration: none; }

        /* --- Language Overlay --- */
        #langOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--secondary); z-index: 5000; display: flex; align-items: center; justify-content: center;
        }
        .lang-box { background: var(--white); padding: 50px; border-radius: 40px; text-align: center; box-shadow: 0 20px 60px rgba(150, 123, 182, 0.15); }
        .lang-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .lang-btn { padding: 12px 25px; border: 2px solid var(--primary); border-radius: 50px; background: transparent; cursor: pointer; color: var(--primary); font-weight: 600; transition: 0.3s; }
        .lang-btn:hover { background: var(--primary); color: white; }

        #mainContent { opacity: 0; transition: 1s ease; }

        /* --- Hero --- */
        .hero {
            height: 70vh; background: linear-gradient(rgba(45, 36, 56, 0.3), rgba(45, 36, 56, 0.3)), 
            url('https://images.unsplash.com/photo-1552196563-55cd4e45efb3?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; text-align: center; color: white;
        }
        .hero h1 { font-size: 4rem; font-family: 'Playfair Display', serif; }

        /* --- Sections --- */
        .section { padding: 80px 10%; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 40px; }
        .card { background: var(--white); padding: 40px; border-radius: 30px; border: 1px solid var(--secondary); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 15px 30px rgba(150, 123, 182, 0.1); }

        /* --- Music Player --- */
        .music-control {
            position: fixed; bottom: 30px; right: 30px; z-index: 3000;
            background: var(--primary); color: white; width: 50px; height: 50px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 10px 20px rgba(150, 123, 182, 0.3);
        }

        /* --- Booking Modal --- */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(45, 36, 56, 0.7); backdrop-filter: blur(10px); align-items: center; justify-content: center;
        }
        .modal-content { background: var(--white); padding: 40px; border-radius: 35px; width: 95%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        .mat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
        .mat { aspect-ratio: 1/1.3; background: var(--secondary); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 600; color: var(--primary-dark); transition: 0.2s; }
        .mat.taken { background: #eee; color: #ccc; cursor: not-allowed; }
        .mat.loading { opacity: 0.5; cursor: wait; }
        .mat:hover:not(.taken) { background: var(--primary); color: white; transform: scale(1.05); }

        .booking-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .booking-form input, .booking-form select { padding: 12px; border: 1px solid var(--secondary); border-radius: 10px; background: var(--bg-light); outline: none; }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

        footer { padding: 40px; background: var(--dark); color: var(--secondary); text-align: center; }
    </style>
</head>
<body onload="checkPreferences()">

    <!-- MUSIC PLAYER -->
    <audio id="zenAudio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3" type="audio/mpeg">
    </audio>
    <div class="music-control" onclick="toggleMusic()" id="musicBtn">
        <i class="fa-solid fa-music"></i>
    </div>

    <!-- LANGUAGE OVERLAY -->
    <div id="langOverlay">
        <div class="lang-box">
            <i class="fa-solid fa-om" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
            <h2>Namaste</h2>
            <p>Select your language</p>
            <div class="lang-options">
                <button class="lang-btn" onclick="setLanguage('en')">English</button>
                <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी</button>
                <button class="lang-btn" onclick="setLanguage('mr')">मराठी</button>
                <button class="lang-btn" onclick="setLanguage('de')">Deutsch</button>
            </div>
        </div>
    </div>

    <div id="mainContent">
        <nav>
            <a href="#" class="logo">AURA YOGA</a>
            <div id="currentLangTag" style="font-size: 0.7rem; color: var(--primary-dark); font-weight: 600; text-transform: uppercase;"></div>
        </nav>

        <section class="hero">
            <div>
                <h1 id="hero-title">Serenity in Stuttgart.</h1>
                <p id="hero-sub">Your journey to mindfulness begins here.</p>
            </div>
        </section>

        <section class="section">
            <h2 id="class-heading">Our Sessions</h2>
            <div class="grid">
                <div class="card" onclick="openBooking('Hatha Flow')">
                    <i class="fa-solid fa-spa" style="font-size: 2rem; color: var(--primary); margin-bottom: 15px;"></i>
                    <h3 id="c1-t">Hatha Flow</h3>
                    <p id="c1-d">Gentle movement.</p>
                </div>
                <div class="card" onclick="openBooking('Vinyasa')">
                    <i class="fa-solid fa-bolt-lightning" style="font-size: 2rem; color: var(--primary); margin-bottom: 15px;"></i>
                    <h3 id="c2-t">Vinyasa</h3>
                    <p id="c2-d">Energetic flow.</p>
                </div>
            </div>
        </section>

        <!-- BOOKING MODAL -->
        <div id="bookingModal" class="modal">
            <div class="modal-content">
                <span style="position:absolute; top:20px; right:25px; cursor:pointer; font-size: 1.5rem; color: var(--primary);" onclick="closeModal()">&times;</span>
                <div id="step1">
                    <h2 id="map-title" style="text-align:center;">Select Your Mat</h2>
                    <p id="loadingText" style="text-align:center; font-size: 0.8rem; color: var(--primary);">Syncing with studio...</p>
                    <div class="mat-grid" id="matGrid"></div>
                </div>
                <div id="step2" style="display:none;">
                    <h2 id="form-title">Registration</h2>
                    <p id="selection-summary" style="color:var(--primary-dark); font-weight: 600; margin-bottom:15px;"></p>
                    
                    <form id="yogaForm" class="booking-form" onsubmit="handleFormSubmit(event)">
                        <input type="text" name="name" id="userName" placeholder="Full Name" required>
                        <input type="email" name="email" id="userEmail" placeholder="Email Address" required>
                        <input type="date" id="bookingDate" required>
                        <button type="submit" class="submit-btn" id="form-btn">Confirm & Reserve</button>
                    </form>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2024 Aura Yoga Studio Stuttgart. Namaste.</p>
        </footer>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Replace this with your actual SheetDB API URL
        const API_URL = "https://sheetdb.io/api/v1/jigyhyj6enowg"; 

        let takenMats = [];
        let selectedMat = null;
        let selectedClass = "";

        // --- 1. Fetch Real-Time Data ---
        async function fetchBookedMats() {
            console.log("7. fetchBookedMats() called."); // ADDED FOR DEBUGGING
            document.getElementById('loadingText').innerText = "Checking availability...";
            try {
                console.log("8. Attempting to fetch from API_URL:", API_URL); // ADDED FOR DEBUGGING
                const response = await fetch(API_URL);
                console.log("9. Fetch response received:", response); // ADDED FOR DEBUGGING
                if (!response.ok) {
                    console.error("10. Fetch response not OK:", response.status, response.statusText); // ADDED FOR DEBUGGING
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log("11. Data parsed from JSON:", data); // ADDED FOR DEBUGGING
                takenMats = data.map(entry => parseInt(entry.mat_id));
                console.log("12. Taken mats identified:", takenMats); // ADDED FOR DEBUGGING
                renderMats();
                document.getElementById('loadingText').innerText = "Studio Synced ✓";
            } catch (error) {
                console.error("13. Error fetching data:", error); // ADDED FOR DEBUGGING
                document.getElementById('loadingText').innerText = "Offline Mode (Local)";
                renderMats();
            }
        }

        function renderMats() {
            const grid = document.getElementById('matGrid');
            grid.innerHTML = "";
            for (let i = 1; i <= 12; i++) {
                const mat = document.createElement('div');
                const isTaken = takenMats.includes(i);
                mat.className = isTaken ? 'mat taken' : 'mat';
                mat.innerText = i;
                if (!isTaken) mat.onclick = () => selectMat(i);
                grid.appendChild(mat);
            }
        }

        // --- 2. Handle Booking (Push to Cloud) ---
        async function handleFormSubmit(e) {
            e.preventDefault();
            console.log("16. handleFormSubmit() called."); // ADDED FOR DEBUGGING
            const btn = document.getElementById('form-btn');
            btn.disabled = true;
            btn.innerText = "Reserving...";

            const bookingData = {
                data: [{
                    mat_id: selectedMat,
                    name: document.getElementById('userName').value,
                    email: document.getElementById('userEmail').value,
                    class: selectedClass,
                    date: document.getElementById('bookingDate').value
                }]
            };
            console.log("17. Booking data prepared:", bookingData); // ADDED FOR DEBUGGING

            try {
                console.log("18. Attempting to POST to API_URL:", API_URL); // ADDED FOR DEBUGGING
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });
                console.log("19. POST response received:", response); // ADDED FOR DEBUGGING

                if (response.ok) {
                    console.log("20. POST request successful!"); // ADDED FOR DEBUGGING
                    alert("Namaste! Mat #" + selectedMat + " is now officially reserved for you.");
                    closeModal();
                    fetchBookedMats(); // Refresh the grid for everyone
                } else {
                    console.error("20. POST request failed:", response.status, response.statusText); // ADDED FOR DEBUGGING
                    alert("Booking failed. Server responded with: " + response.status + " " + response.statusText);
                }
            } catch (error) {
                console.error("21. Error during POST request:", error); // ADDED FOR DEBUGGING
                alert("Connection error. Please try again.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Confirm & Reserve";
                console.log("22. Form submission process finished."); // ADDED FOR DEBUGGING
            }
        }

        // --- UI Logic ---
        function checkPreferences() {
            console.log("1. checkPreferences() called on page load."); // ADDED FOR DEBUGGING
            const savedLang = localStorage.getItem('auraLang');
            if (savedLang) {
                console.log("2. Saved language found:", savedLang); // ADDED FOR DEBUGGING
                setLanguage(savedLang);
            } else {
                console.log("2. No saved language found, language overlay should be visible."); // ADDED FOR DEBUGGING
            }
        }

        function setLanguage(lang) {
            console.log("3. setLanguage() called with:", lang); // ADDED FOR DEBUGGING
            localStorage.setItem('auraLang', lang);
            document.getElementById('langOverlay').style.display = 'none';
            document.getElementById('mainContent').style.opacity = '1';
            document.getElementById('currentLangTag').innerText = lang;
            console.log("4. Language set, overlay hidden, main content visible."); // ADDED FOR DEBUGGING
        }

        function openBooking(cls) {
            console.log("5. openBooking() called for class:", cls); // ADDED FOR DEBUGGING
            selectedClass = cls;
            document.getElementById('bookingModal').style.display = 'flex';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
            fetchBookedMats(); // Fetch fresh data every time modal opens
            console.log("6. Booking modal opened, calling fetchBookedMats()."); // ADDED FOR DEBUGGING
        }

        function selectMat(num) {
            console.log("14. Mat selected:", num); // ADDED FOR DEBUGGING
            selectedMat = num;
            document.getElementById('selection-summary').innerText = selectedClass + " | Mat #" + num;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            console.log("15. Moving to step 2 (registration form)."); // ADDED FOR DEBUGGING
        }

        function closeModal() { 
            document.getElementById('bookingModal').style.display = 'none'; 
            console.log("Modal closed."); // ADDED FOR DEBUGGING
        }
        
        const audio = document.getElementById('zenAudio');
        function toggleMusic() {
            if (audio.paused) { 
                audio.play(); 
                console.log("Music started."); // ADDED FOR DEBUGGING
            } else { 
                audio.pause(); 
                console.log("Music paused."); // ADDED FOR DEBUGGING
            }
        }
    </script>
</body>
</html>
