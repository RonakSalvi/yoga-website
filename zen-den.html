<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Den | Aura Members</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root { --md-primary: #006a6a; --md-surface: #f4fbf9; --radius-xl: 28px; }
        body { font-family: 'Roboto', sans-serif; background: var(--md-surface); margin: 0; }
        nav { height: 64px; display: flex; align-items: center; padding: 0 24px; background: white; border-bottom: 1px solid #dae5e4; }
        .nav-links a { text-decoration: none; color: #444; margin-left: 20px; font-size: 14px; }
        
        .gate { height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .content { display: none; padding: 40px 24px; max-width: 900px; margin: 0 auto; }
        
        .music-card { background: white; padding: 24px; border-radius: var(--radius-xl); display: flex; align-items: center; gap: 20px; margin-bottom: 20px; border: 1px solid #eee; }
        .play-btn { background: var(--md-primary); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <div style="flex-grow:1; font-family:'Google Sans'; color:var(--md-primary)">Aura Zen Den</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="booking.html">Book a Mat</a>
            <a href="zen-den.html">Zen Den</a>
        </div>
    </nav>

    <div id="authGate" class="gate">
        <div>
            <span class="material-symbols-outlined" style="font-size:48px; color:var(--md-primary)">lock</span>
            <h2>Member Access</h2>
            <input type="password" id="pw" placeholder="Enter Code" style="padding:12px; border-radius:8px; border:1px solid #ccc; margin:20px 0; width:200px;"><br>
            <button onclick="unlock()" style="background:var(--md-primary); color:white; border:none; padding:10px 30px; border-radius:100px; cursor:pointer;">Enter Den</button>
            <p style="font-size:12px; color:#999; margin-top:10px;">Hint: yoga2024</p>
        </div>
    </div>

    <div id="mainContent" class="content">
        <h1 style="font-family:'Google Sans'">Your Practice Sanctuary</h1>
        <p style="margin-bottom:40px;">Curated sounds and resources for your home flow.</p>

        <div class="music-card">
            <button class="play-btn" onclick="play('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')"><span class="material-symbols-outlined">play_arrow</span></button>
            <div>
                <h4 style="margin:0">Morning Meditation</h4>
                <p style="margin:0; font-size:12px; color:#666;">Ambient • 15 Minutes</p>
            </div>
        </div>

        <div class="music-card">
            <button class="play-btn" onclick="play('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')"><span class="material-symbols-outlined">play_arrow</span></button>
            <div>
                <h4 style="margin:0">Deep Sleep Bowls</h4>
                <p style="margin:0; font-size:12px; color:#666;">Tibetan Bowls • 30 Minutes</p>
            </div>
        </div>
        
        <audio id="audioPlayer"></audio>
    </div>

    <script>
        function unlock() {
            if(document.getElementById('pw').value === 'yoga2024') {
                document.getElementById('authGate').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } else { alert('Incorrect code'); }
        }
        function play(url) {
            const a = document.getElementById('audioPlayer');
            a.src = url;
            a.play();
        }
    </script>
</body>
</html>
