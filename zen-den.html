<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Den | Aura Members</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" />
    <style>
        :root { --lavender-deep: #6750A4; --lavender-light: #F3E5F5; }
        body { font-family: 'Inter', sans-serif; background: #FDFCFD; margin: 0; }
        
        .gate-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--lavender-light); }
        .login-card { background: white; padding: 60px; border-radius: 40px; text-align: center; box-shadow: 0 30px 60px rgba(103, 80, 164, 0.1); }
        
        .den-content { display: none; padding: 120px 5% 60px; max-width: 1000px; margin: 0 auto; }
        .playlist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
        
        .track-card { 
            background: white; padding: 25px; border-radius: 24px; border: 1px solid var(--lavender-light);
            display: flex; align-items: center; gap: 20px; transition: 0.3s; cursor: pointer;
        }
        .track-card:hover { background: var(--lavender-light); }
        .play-icon { background: var(--lavender-deep); color: white; width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="gate" class="gate-screen">
        <div class="login-card">
            <h2 style="font-family:'Playfair Display'; font-size: 32px; margin-bottom: 10px;">The Sanctuary Gate</h2>
            <p style="color:#888; margin-bottom: 30px;">Enter your member code to listen.</p>
            <input type="password" id="code" placeholder="••••" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ddd; text-align: center; font-size: 24px; letter-spacing: 8px; margin-bottom: 20px;">
            <button onclick="unlock()" style="width: 100%; background: var(--lavender-deep); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold;">Unlock Den</button>
            <p style="font-size: 10px; color: #bbb; margin-top: 20px;">HINT: yoga2024</p>
        </div>
    </div>

    <div id="den" class="den-content">
        <h1 style="font-size: 48px; margin-bottom: 10px;">Sonic Serenity</h1>
        <p style="color:#666;">Curated frequencies for your lavender-scented practice.</p>

        <div class="playlist-grid">
            <div class="track-card" onclick="play('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 'Morning Mist')">
                <div class="play-icon"><span class="material-symbols-outlined">play_arrow</span></div>
                <div><p style="font-weight: 500;">Morning Mist</p><small>Ambient • 12m</small></div>
            </div>
            <div class="track-card" onclick="play('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 'Lavender Fields')">
                <div class="play-icon"><span class="material-symbols-outlined">play_arrow</span></div>
                <div><p style="font-weight: 500;">Lavender Fields</p><small>Deep Sleep • 20m</small></div>
            </div>
        </div>

        <div id="player-bar" style="position: fixed; bottom: 30px; left: 5%; right: 5%; background: white; padding: 20px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: none; align-items: center; gap: 20px; border: 1px solid var(--lavender-light);">
            <span id="playing-name" style="font-weight: bold; flex-grow: 1;">Track Name</span>
            <audio id="audio" controls style="height: 30px;"></audio>
        </div>
    </div>

    <script>
        function unlock() {
            if(document.getElementById('code').value === 'yoga2024') {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('den').style.display = 'block';
            } else { alert('The gate remains closed.'); }
        }
        function play(url, name) {
            const a = document.getElementById('audio');
            const bar = document.getElementById('player-bar');
            document.getElementById('playing-name').innerText = name;
            bar.style.display = 'flex';
            a.src = url;
            a.play();
        }
    </script>
</body>
</html>
